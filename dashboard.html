<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Money Saver App</title>

<!-- Link CSS -->
<link rel="stylesheet" href="css/style.css">
</head>

<body>
<div class="layout">
  <aside class="sidebar">
    <h2><span class="logo-icon">💸</span> FOURCE</h2>
    <a href="dashboard.html">Dashboard</a>
    <a href="goals.html">貯金目標</a>
    <a href="analytics.html">分析</a>
    <a href="achievements.html">達成バッジ</a>
  </aside>
<div class="main">

  <!-- Header -->
  <div class="header">
    <h2>Hello, Ruby 👋</h2>

    <div class="top-actions">
      <button onclick="goPage('profile.html')">👤 Profile</button>
    </div>
  </div>

  <!-- Top Cards -->
  <div class="top">
    <div class="card">
      <p>Monthly Income</p>
      <div class="income">¥200,000</div>
    </div>

    <div class="card">
      <p>Savings</p>
      <div class="income">¥50,000</div>
    </div>

    <div class="card">
      <p>Daily Streak</p>
      <div class="streak">12 Days 🔥</div>
    </div>
  </div>

  <!-- Budget Overview -->
  <div class="card budget">
    <h3>Budget Overview</h3>

    <div class="budget-card" onclick="goPage('basic.html')">
      <div class="budget-top">
        <span>🏠 Basic Cost</span>
        <span>¥60,000 / ¥100,000</span>
      </div>
      <div class="bar"><div class="fill green"></div></div>
    </div>

    <div class="budget-card" onclick="goPage('fun.html')">
      <div class="budget-top">
        <span>🎮 Entertainment</span>
        <span>¥20,000 / ¥50,000</span>
      </div>
      <div class="bar"><div class="fill pink"></div></div>
    </div>

    <div class="budget-card" onclick="goPage('emergency.html')">
      <div class="budget-top">
        <span>⚠️ Emergency</span>
        <span>¥15,000 / ¥50,000</span>
      </div>
      <div class="bar"><div class="fill red"></div></div>
    </div>

  </div>

</div>

<script>
function goPage(page){
  window.location.href = page;
}

function like(){
  alert("❤️ You liked your savings progress!");
}
</script>
</div>
</body>
</html>
